name: Claim Faucet (sans proxy)

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email du compte (CLAIM_EMAIL)"
        required: true
        type: string
      platform:
        description: "Plateforme (ex: tronpick)"
        required: true
        type: string
      userId:
        description: "Identifiant utilisateur (USER_ID)"
        required: true
        type: string
      password:
        description: "Mot de passe (ignore pour le claim)"
        required: false
        type: string
        default: ""
      proxyIndex:
        description: "Index du proxy (ignore)"
        required: false
        type: string
        default: "0"

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    container:
      image: ghcr.io/hasiniainahasina1-art/camoufox-system:latest
      options: --user camoxuser
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Masquer tous les secrets
        run: |
          echo "::add-mask::${{ secrets.GH_TOKEN }}"
          echo "::add-mask::${{ secrets.CRYPTO_SECRET }}"
          echo "::add-mask::${{ secrets.CRON_SECRET }}"
          echo "::add-mask::${{ secrets.APP_URL }}"
          echo "::add-mask::${{ github.event.inputs.email }}"
          echo "::add-mask::${{ github.event.inputs.userId }}"
          echo "::add-mask::hasiniainahasina1-art"
          echo "::add-mask::pick-faucet"

      - name: Cloner le depot prive dans /app
        timeout-minutes: 1
        run: |
          set -e
          git clone \
            --quiet \
            --depth=1 \
            --branch main \
            https://${{ secrets.GH_TOKEN }}@github.com/hasiniainahasina1-art/pick-faucet.git \
            /tmp/repo

          cp -rn /tmp/repo/. /app/ || true
          cp /tmp/repo/.env /app/.env 2>/dev/null || true
          rm -rf /tmp/repo

          echo "Depot prive copie dans /app"
          ls /app

      - name: Verifier les fichiers requis
        timeout-minutes: 1
        run: |
          for f in voanjo1.py ananana.py ravitoto.py; do
            if [ ! -f "/app/$f" ]; then
              echo "Fichier manquant : $f"
              exit 1
            else
              echo "Present : $f"
            fi
          done

      - name: Executer le script de claim
        id: claim
        timeout-minutes: 5
        working-directory: /app
        env:
          HOME: /home/camoxuser
          DISPLAY: ":99"
          CLAIM_EMAIL: ${{ github.event.inputs.email }}
          CLAIM_PLATFORM: ${{ github.event.inputs.platform }}
          USER_ID: ${{ github.event.inputs.userId }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: hasiniainahasina1-art
          GH_REPO: pick-faucet
          GH_BRANCH: main
          CRYPTO_SECRET: ${{ secrets.CRYPTO_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          timeout 270 xvfb-run -s "-screen 0 1280x720x24" --auto-servernum \
            python voanjo1.py
          EXIT_CODE=$?

          if [ "$EXIT_CODE" = "124" ]; then
            echo "Timeout apres 4min30s"
            echo "exit_code=124" >> $GITHUB_OUTPUT
            exit 124
          fi

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Upload video de session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-claim-${{ github.event.inputs.platform }}-${{ github.run_id }}
          path: /app/videos/
          retention-days: 1
          if-no-files-found: warn

      - name: Resultat final
        if: always()
        run: |
          CODE="${{ steps.claim.outputs.exit_code }}"
          PLATFORM="${{ github.event.inputs.platform }}"
          if [ "$CODE" = "0" ]; then
            echo "Claim reussi - $PLATFORM"
          elif [ "$CODE" = "124" ]; then
            echo "Timeout - $PLATFORM"
            exit 1
          else
            echo "Claim echoue (code $CODE) - $PLATFORM"
            exit 1
          fi
