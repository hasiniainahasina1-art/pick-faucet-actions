name: Test Account Login

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Adresse email du compte"
        required: true
        type: string
      password:
        description: "Mot de passe du compte"
        required: true
        type: string
      platform:
        description: "Plateforme (ex: tronpick, tronlux, litepick)"
        required: true
        type: string
      proxyIndex:
        description: "Index du proxy (ignoré)"
        required: false
        type: string
        default: "0"
      initialTimer:
        description: "Timer initial (format mm:ss)"
        required: false
        type: string
        default: "60:00"
      action:
        description: "Action (ignoré)"
        required: false
        type: string
        default: "login"
      userId:
        description: "Identifiant utilisateur Supabase"
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: ghcr.io/hasiniainahasina1-art/camoufox-system:latest
      options: --user camoxuser
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Masquer email et mot de passe dans les logs
        run: |
          echo "::add-mask::${{ github.event.inputs.password }}"
          echo "::add-mask::${{ github.event.inputs.email }}"

      - name: Cloner le dépôt privé (scripts + comptes) dans /app
        timeout-minutes: 2
        run: |
          set -e
          # Scripts + fichiers compte = repo PRIVÉ
          git clone \
            --depth=1 \
            --branch main \
            https://${{ secrets.GH_TOKEN }}@github.com/hasiniainahasina1-art/pick-faucet.git \
            /tmp/repo

          cp -rn /tmp/repo/. /app/ || true
          cp /tmp/repo/.env /app/.env 2>/dev/null || true
          rm -rf /tmp/repo

          mkdir -p /app/videos

          echo "✅ Dépôt privé copié dans /app"
          ls -la /app | head -40

      - name: Vérifier les fichiers requis
        timeout-minutes: 1
        run: |
          for f in login.py ananana.py ravitoto.py; do
            if [ ! -f "/app/$f" ]; then
              echo "❌ Fichier manquant : $f"
              exit 1
            else
              echo "✅ Présent : $f"
            fi
          done

      - name: Exécuter le script de login
        id: login
        timeout-minutes: 10
        working-directory: /app
        env:
          PYTHONUNBUFFERED: "1"
          HOME: /home/camoxuser
          DISPLAY: ":99"
          TEST_EMAIL: ${{ github.event.inputs.email }}
          TEST_PASSWORD: ${{ github.event.inputs.password }}
          TEST_PLATFORM: ${{ github.event.inputs.platform }}
          TEST_PROXY_INDEX: ${{ github.event.inputs.proxyIndex }}
          TEST_INITIAL_TIMER: ${{ github.event.inputs.initialTimer }}
          USER_ID: ${{ github.event.inputs.userId }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: hasiniainahasina1-art
          GH_REPO: pick-faucet
          GH_BRANCH: main
          CRYPTO_SECRET: ${{ secrets.CRYPTO_SECRET }}
        run: |
          set +e
          # Double masquage (au cas où le 1er step n'a pas suffi pour ce job)
          echo "::add-mask::${{ github.event.inputs.password }}"
          echo "::add-mask::${{ github.event.inputs.email }}"

          export PYTHONUNBUFFERED=1
          timeout 540 xvfb-run -s "-screen 0 1280x720x24" --auto-servernum \
            python -u login.py
          EXIT_CODE=$?

          if [ "$EXIT_CODE" = "124" ]; then
            echo "⏰ Timeout login (\~9 min)"
            echo "exit_code=124" >> "$GITHUB_OUTPUT"
            exit 124
          fi

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Upload vidéo de session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-login-\( {{ github.event.inputs.platform }}- \){{ github.run_id }}
          path: /app/videos/
          retention-days: 3
          if-no-files-found: warn
      - name: Résultat final
        if: always()
        run: |
          CODE="${{ steps.login.outputs.exit_code }}"
          PLATFORM="${{ github.event.inputs.platform }}"

          if [ "$CODE" = "0" ]; then
            echo "✅ Login réussi — plateforme $PLATFORM"
          elif [ "$CODE" = "124" ]; then
            echo "⏰ Timeout — plateforme $PLATFORM"
            exit 1
          else
            echo "❌ Login échoué (code $CODE) — plateforme $PLATFORM"
            exit 1
          fi
