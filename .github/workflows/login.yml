name: Test Account Login

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Adresse email du compte"
        required: true
        type: string
      password:
        description: "Mot de passe du compte"
        required: true
        type: string
      platform:
        description: "Plateforme (ex: tronpick)"
        required: true
        type: string
      proxyIndex:
        description: "Index du proxy (ignoré)"
        required: false
        type: string
        default: "0"
      initialTimer:
        description: "Timer initial (format mm:ss)"
        required: false
        type: string
        default: "60:00"
      action:
        description: "Action (ignoré)"
        required: false
        type: string
        default: "login"
      userId:
        description: "Identifiant utilisateur (optionnel)"
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/hasiniainahasina1-art/camoufox-system:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Cloner le dépôt privé dans /app
        run: |
          git clone \
            --depth=1 \
            --branch main \
            https://${{ secrets.GH_TOKEN }}@github.com/hasiniainahasina1-art/pick-faucet.git \
            /tmp/repo

          # Copier les fichiers sans écraser les dossiers système de /app
          cp -rn /tmp/repo/. /app/

          # Copier .env si présent
          cp /tmp/repo/.env /app/.env 2>/dev/null || true

          # Nettoyer le clone (contient le token en clair dans l'historique git)
          rm -rf /tmp/repo

          echo "✅ Dépôt privé copié dans /app"
          ls /app

      - name: Vérifier les fichiers requis
        run: |
          for f in test_login_workflow.py ananana.py ravitoto.py; do
            if [ ! -f "/app/$f" ]; then
              echo "❌ Fichier manquant : $f"
              exit 1
            else
              echo "✅ Présent : $f"
            fi
          done

      - name: Exécuter le script de login
        id: login
        working-directory: /app
        env:
          HOME: /home/camoxuser
          DISPLAY: ":99"
          TEST_EMAIL: ${{ github.event.inputs.email }}
          TEST_PASSWORD: ${{ github.event.inputs.password }}
          TEST_PLATFORM: ${{ github.event.inputs.platform }}
          TEST_INITIAL_TIMER: ${{ github.event.inputs.initialTimer }}
          USER_ID: ${{ github.event.inputs.userId }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: hasiniainahasina1-art
          GH_REPO: pick-faucet
          GH_BRANCH: main
          CRYPTO_SECRET: ${{ secrets.CRYPTO_SECRET }}
        run: |
          xvfb-run -s "-screen 0 1280x720x24" --auto-servernum \
            python test_login_workflow.py
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Upload vidéo de session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.event.inputs.platform }}-${{ github.event.inputs.email }}-${{ github.run_id }}
          path: /app/videos/
          retention-days: 3
          if-no-files-found: warn

      - name: Résultat final
        if: always()
        run: |
          if [ "${{ steps.login.outputs.exit_code }}" = "0" ]; then
            echo "✅ Login réussi — ${{ github.event.inputs.email }} sur ${{ github.event.inputs.platform }}"
          else
            echo "❌ Login échoué — ${{ github.event.inputs.email }} sur ${{ github.event.inputs.platform }}"
            exit 1
          fi
