name: Test Account Login

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Adresse email du compte"
        required: true
        type: string
      password:
        description: "Mot de passe du compte"
        required: true
        type: string
      platform:
        description: "Plateforme (ex: tronpick)"
        required: true
        type: string
      proxyIndex:
        description: "Index du proxy (ignoré)"
        required: false
        type: string
        default: "0"
      initialTimer:
        description: "Timer initial (format mm:ss)"
        required: false
        type: string
        default: "60:00"
      action:
        description: "Action (ignoré)"
        required: false
        type: string
        default: "login"
      userId:
        description: "Identifiant utilisateur (optionnel)"
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5        # ← Timeout global du job à 5min (sécurité GitHub)
    container:
      image: ghcr.io/hasiniainahasina1-art/camoufox-system:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Cloner le dépôt privé dans /app
        timeout-minutes: 1    # ← Clone ne doit pas dépasser 1min
        run: |
          git clone \
            --depth=1 \
            --branch main \
            https://${{ secrets.GH_TOKEN }}@github.com/hasiniainahasina1-art/pick-faucet.git \
            /tmp/repo

          cp -rn /tmp/repo/. /app/
          cp /tmp/repo/.env /app/.env 2>/dev/null || true
          rm -rf /tmp/repo

          echo "✅ Dépôt privé copié dans /app"
          ls /app

      - name: Vérifier les fichiers requis
        timeout-minutes: 1    # ← Vérification rapide
        run: |
          for f in test_login_workflow.py ananana.py ravitoto.py; do
            if [ ! -f "/app/$f" ]; then
              echo "❌ Fichier manquant : $f"
              exit 1
            else
              echo "✅ Présent : $f"
            fi
          done

      - name: Exécuter le script de login
        id: login
        timeout-minutes: 3    # ← Script tué après 3min si pas terminé (laisse ~30s pour upload)
        working-directory: /app
        env:
          HOME: /home/camoxuser
          DISPLAY: ":99"
          TEST_EMAIL: ${{ github.event.inputs.email }}
          TEST_PASSWORD: ${{ github.event.inputs.password }}
          TEST_PLATFORM: ${{ github.event.inputs.platform }}
          TEST_INITIAL_TIMER: ${{ github.event.inputs.initialTimer }}
          USER_ID: ${{ github.event.inputs.userId }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: hasiniainahasina1-art
          GH_REPO: pick-faucet
          GH_BRANCH: main
          CRYPTO_SECRET: ${{ secrets.CRYPTO_SECRET }}
        run: |
          # Lancer le script avec timeout shell de 4min30s précis
          timeout 270 xvfb-run -s "-screen 0 1280x720x24" --auto-servernum \
            python test_login_workflow.py
          EXIT_CODE=$?

          # 124 = timeout shell atteint
          if [ "$EXIT_CODE" = "124" ]; then
            echo "⏰ Script tué après 4min30s (timeout atteint)"
            echo "exit_code=124" >> $GITHUB_OUTPUT
            exit 124
          fi

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Upload vidéo de session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.event.inputs.platform }}-${{ github.event.inputs.email }}-${{ github.run_id }}
          path: /app/videos/
          retention-days: 3
          if-no-files-found: warn

      - name: Résultat final
        if: always()
        run: |
          CODE="${{ steps.login.outputs.exit_code }}"
          EMAIL="${{ github.event.inputs.email }}"
          PLATFORM="${{ github.event.inputs.platform }}"

          if [ "$CODE" = "0" ]; then
            echo "✅ Login réussi — $EMAIL sur $PLATFORM"
          elif [ "$CODE" = "124" ]; then
            echo "⏰ Timeout — script non terminé après 4min30s — $EMAIL sur $PLATFORM"
            exit 1
          else
            echo "❌ Login échoué (code $CODE) — $EMAIL sur $PLATFORM"
            exit 1
          fi
