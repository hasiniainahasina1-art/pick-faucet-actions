name: Logout Account (sans proxy)

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email du compte (LOGOUT_EMAIL)"
        required: true
        type: string
      platform:
        description: "Plateforme (ex: tronpick)"
        required: true
        type: string
      userId:
        description: "Identifiant utilisateur (USER_ID)"
        required: true
        type: string
      # Inputs optionnels pour compatibilité avec le dashboard
      password:
        description: "Mot de passe (ignoré pour la déconnexion)"
        required: false
        type: string
        default: ""
      proxyIndex:
        description: "Index du proxy (ignoré, pas de proxy utilisé)"
        required: false
        type: string
        default: "0"

jobs:
  logout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/hasiniainahasina1-art/camoufox-system:latest
      options: --user camoxuser
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Cloner le dépôt privé (sans supprimer /app)
        run: |
          git clone https://${{ secrets.GH_TOKEN }}@github.com/hasiniainahasina1-art/pick-faucet.git /tmp/repo
          cp -r /tmp/repo/* /app/
          cp -r /tmp/repo/.env /app/ 2>/dev/null || true

      - name: Exécuter le script de déconnexion
        working-directory: /app
        env:
          HOME: /home/camoxuser
          DISPLAY: ":99"
          LOGOUT_EMAIL: ${{ github.event.inputs.email }}
          LOGOUT_PLATFORM: ${{ github.event.inputs.platform }}
          USER_ID: ${{ github.event.inputs.userId }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: hasiniainahasina1-art
          GH_REPO: pick-faucet
          GH_BRANCH: main
          CRYPTO_SECRET: ${{ secrets.CRYPTO_SECRET }}
        run: xvfb-run -s "-screen 0 1280x720x24" --auto-servernum python borita.py

      - name: Upload des vidéos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logout-video
          path: /app/videos/
