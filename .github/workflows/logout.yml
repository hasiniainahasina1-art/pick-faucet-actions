name: Logout Account (sans proxy)

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email du compte (LOGOUT_EMAIL)"
        required: true
        type: string
      platform:
        description: "Plateforme (ex: tronpick)"
        required: true
        type: string
      userId:
        description: "Identifiant utilisateur (USER_ID)"
        required: true
        type: string
      password:
        description: "Mot de passe (ignore)"
        required: false
        type: string
        default: ""
      proxyIndex:
        description: "Index du proxy (ignore)"
        required: false
        type: string
        default: "0"

jobs:
  logout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/hasiniainahasina1-art/camoufox-system:latest
      options: --user camoxuser
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Masquer tous les secrets
        run: |
          echo "::add-mask::${{ secrets.GH_TOKEN }}"
          echo "::add-mask::${{ secrets.CRYPTO_SECRET }}"
          echo "::add-mask::${{ github.event.inputs.email }}"
          echo "::add-mask::${{ github.event.inputs.userId }}"
          echo "::add-mask::hasiniainahasina1-art"
          echo "::add-mask::pick-faucet"

      - name: Cloner le depot prive dans /app
        timeout-minutes: 2
        run: |
          set -e
          git clone \
            --quiet \
            --depth=1 \
            --branch main \
            https://${{ secrets.GH_TOKEN }}@github.com/hasiniainahasina1-art/pick-faucet.git \
            /tmp/repo

          cp -rn /tmp/repo/. /app/ || true
          cp /tmp/repo/.env /app/.env 2>/dev/null || true
          rm -rf /tmp/repo

          echo "Depot prive copie dans /app"

      - name: Executer le script de deconnexion
        working-directory: /app
        env:
          HOME: /home/camoxuser
          DISPLAY: ":99"
          LOGOUT_EMAIL: ${{ github.event.inputs.email }}
          LOGOUT_PLATFORM: ${{ github.event.inputs.platform }}
          USER_ID: ${{ github.event.inputs.userId }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: hasiniainahasina1-art
          GH_REPO: pick-faucet
          GH_BRANCH: main
          CRYPTO_SECRET: ${{ secrets.CRYPTO_SECRET }}
        run: |
          xvfb-run -s "-screen 0 1280x720x24" --auto-servernum \
            python borita.py

      - name: Upload video de session
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-logout-${{ github.run_id }}
          path: /app/videos/
          retention-days: 1
          if-no-files-found: warn
